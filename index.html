<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1상세페이지1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; /* 전체 페이지 스크롤 방지 (좌우 독립 스크롤 유지) */
    }

    /* 1. 1920*55 가라 헤더 */
    header {
      width: 100vw;
      height: 55px;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid #eee;
      background-color: #fff;
      overflow: hidden;
    }

    header img {
      width: 100%;
      height: 55px;
      object-fit: contain; /* 1920*55 비율이 잘리지 않고 전체가 딱 맞게 출력 */
      object-position: center;
      display: block;
    }

    /* 메인 2열 분할 레이아웃 (헤더 55px 제외) */
    .container {
      display: flex;
      height: calc(100vh - 55px);
      width: 100vw;
    }

    /* 좌측 영역 (독립 스크롤) */
    .left-section {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      background-color: #f9f9f9;
    }

    .left-section img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* 우측 영역 (독립 스크롤) */
    .right-section {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      padding: 0 40px 40px 40px; /* 여백으로 인한 잘림 방지 */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-info-wrapper {
      width: 100%;
      max-width: 518px; /* 518px 유지 */
    }

    /* 2. 우측 상품 이미지 컨테이너 (헤더 바로 밑) */
    .product-image-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* 메인 이미지 (기본 518x518) */
    .main-image {
      width: 100%;
      max-width: 518px;
      aspect-ratio: 1 / 1; /* 1:1 정사이즈 비율 유지 */
      object-fit: contain;
      border: 1px solid transparent;
      transition: width 0.35s ease, height 0.35s ease, border-color 0.35s ease;
    }

    /* 아더 컬러 이미지 (기본 0x0 및 숨김) */
    .other-color-image {
      width: 0;
      height: 0;
      object-fit: contain;
      opacity: 0;
      border: 1px solid #ddd;
      transition: width 0.35s ease, height 0.35s ease, opacity 0.35s ease;
    }

    /* ==============================================
       토글 활성화 시 이미지 스타일 (100x100 변화)
       ============================================== */
    
    .right-section.toggle-active .product-image-container {
      justify-content: flex-start;
    }

    .right-section.toggle-active .main-image {
      width: 100px;
      height: 100px;
      border-color: #000;
    }

    .right-section.toggle-active .other-color-image {
      width: 100px;
      height: 100px;
      opacity: 1;
    }

    /* ============================================== */

    /* 상품명 & 가격 */
    .product-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    /* 토글/드롭다운 스타일 */
    .toggle-group {
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
      margin-bottom: 20px;
    }

    .toggle-item {
      border-bottom: 1px solid #eee;
    }

    .toggle-item:last-child {
      border-bottom: none;
    }

    .toggle-header {
      width: 100%;
      padding: 14px 0;
      background: none;
      border: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }

    .toggle-icon {
      font-size: 0.7rem;
      transition: transform 0.3s ease;
    }

    .toggle-content {
      max-height: 0;
      overflow: hidden;
      font-size: 0.75rem;
      line-height: 1.6;
      color: #333;
      transition: max-height 0.35s ease, padding 0.35s ease;
    }

    .toggle-item.open .toggle-content {
      max-height: 500px;
      padding-bottom: 16px;
    }

    .toggle-item.open .toggle-icon {
      transform: rotate(180deg);
    }

    /* 버튼 스타일 */
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 14px 0;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid #000;
      background-color: #fff;
      cursor: pointer;
      text-align: center;
    }

    .btn-buy {
      background-color: #e5e5e5;
      border-color: #e5e5e5;
    }
  </style>
</head>
<body>

  <!-- 1920*55 가라 헤더 이미지 -->
  <header>
    <img src="images/header.jpg" alt="Header Navigation">
  </header>

  <div class="container">
    
    <!-- 좌측 영역: 캠페인/룩북 이미지들 -->
    <div class="left-section">
      <img src="images/campaign1.jpg" alt="Campaign Image 1">
      <img src="images/campaign2.jpg" alt="Campaign Image 2">
    </div>

    <!-- 우측 영역: 메인/아더컬러 상품 이미지 및 정보 -->
    <div class="right-section" id="rightSection">
      <div class="product-info-wrapper">
        
        <div class="product-image-container">
          <!-- 메인 상품 이미지 -->
          <img src="images/product_main.jpg" alt="Product Main (Ivory)" class="main-image">
          <!-- 아더 컬러 상품 이미지 -->
          <img src="images/product_other.jpg" alt="Product Other (Gray)" class="other-color-image">
        </div>

        <div class="product-title">Pointelle knit cardigan (Ivory)</div>
        <div class="product-price">98,000원</div>

        <div class="toggle-group">
          
          <div class="toggle-item">
            <button class="toggle-header">
              <span>SIZE</span>
              <span class="toggle-icon">▼</span>
            </button>
            <div class="toggle-content">
              FREE (어깨 38 / 가슴 42 / 소매 18 / 총장 52 cm)
            </div>
          </div>

          <div class="toggle-item">
            <button class="toggle-header">
              <span>DETAIL INFO</span>
              <span class="toggle-icon">▼</span>
            </button>
            <div class="toggle-content">
              자수 포인트 코튼 카디건 탑<br><br>
              * 코튼 소재로 편안한 착용감<br>
              * 페이크 플랩 포켓 디자인과 조절 가능한 스트랩 디테일
            </div>
          </div>

          <div class="toggle-item">
            <button class="toggle-header">
              <span>SIZE GUIDE</span>
              <span class="toggle-icon">▼</span>
            </button>
            <div class="toggle-content">
              정사이즈 착용을 권장합니다.
            </div>
          </div>

        </div>

        <div class="btn-group">
          <button class="btn btn-buy">BUY IT NOW</button>
          <button class="btn">ADD TO CART</button>
        </div>

      </div>
    </div>

  </div>

  <script>
    const rightSection = document.getElementById('rightSection');
    const toggleItems = document.querySelectorAll('.toggle-item');

    toggleItems.forEach(item => {
      const header = item.querySelector('.toggle-header');
      
      header.addEventListener('click', () => {
        const isOpen = item.classList.contains('open');
        
        if (isOpen) {
          item.classList.remove('open');
        } else {
          item.classList.add('open');
        }

        const hasOpenItem = document.querySelector('.toggle-item.open') !== null;

        if (hasOpenItem) {
          rightSection.classList.add('toggle-active');
        } else {
          rightSection.classList.remove('toggle-active');
        }
      });
    });
  </script>
</body>
</html>
